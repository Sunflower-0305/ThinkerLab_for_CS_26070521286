<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYMBIOSIS EVENTS REGISTRATION Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333333;
        }

        main {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            border-top: 6px solid #a8e6cf;
        }

        header h1 {
            font-size: 1.4rem;
            color: #4a6fa5;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555555;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #a8e6cf;
            background-color: #ffffff;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type="radio"] {
            accent-color: #4a6fa5;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4a6fa5;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #3b5984;
        }
    </style>
</head>
<body>

    <main>
        <header>
            <h1>Symbiosis Events Registration</h1>
        </header>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="prn">PRN</label>
                <input type="text" id="prn" name="prn" placeholder="Enter your PRN" required>
            </div>

            <div class="form-group">
                <label>Section</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="section" value="A" required> A</label>
                    <label class="radio-option"><input type="radio" name="section" value="B"> B</label>
                    <label class="radio-option"><input type="radio" name="section" value="C"> C</label>
                    <label class="radio-option"><input type="radio" name="section" value="D"> D</label>
                    <label class="radio-option"><input type="radio" name="section" value="E"> E</label>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="event">Select Event</label>
                <select id="event" name="event" required>
                    <option value="" disabled selected>-- Select an Event --</option>
                    <option value="html-programming">HTML Programming</option>
                    <option value="iot-programming">IoT Programming</option>
                    <option value="workshop">Workshop</option>
                    <option value="seminars">Seminars</option>
                </select>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </main>

</body>
</html>
